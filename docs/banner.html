<!doctype html><html><head><style>
@font-face{font-family:"Archivo";src:url(../src/app/fonts/archivo-latin.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%}
*{box-sizing:border-box}
body{margin:0;width:1280px;height:640px;font-family:Archivo,sans-serif}
.b{position:relative;width:1280px;height:640px;overflow:hidden;
  background:radial-gradient(110% 120% at 18% 12%,#2b5a55 0%,#173533 48%,#0b1a19 100%)}
.b::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:14px 14px}
.left{position:absolute;left:84px;top:104px;width:560px;z-index:2;color:#fff8e8}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:104px;height:104px;border-radius:24px;box-shadow:0 14px 30px -10px rgba(0,0,0,.6)}
.t{width:84px;height:84px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(#fffdf6,#fff8e8);box-shadow:0 7px 0 #dccaa6,0 16px 24px -8px rgba(0,0,0,.5);
  font-weight:900;font-stretch:112%;font-size:58px;line-height:1;padding-bottom:8px}
h1{margin:44px 0 0;font-size:56px;line-height:1.02;font-weight:900;font-stretch:118%;letter-spacing:-.01em}
p{margin:18px 0 0;font-size:23px;line-height:1.45;color:rgba(255,248,232,.78);max-width:500px}
.chips{display:grid;grid-template-columns:repeat(2,max-content);gap:10px;margin-top:30px}
.chip{text-align:center;padding:8px 14px 9px;border-radius:999px;font-size:17px;font-weight:700;color:#fff8e8;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18),0 3px 0 rgba(0,0,0,.35)}
.phones{position:absolute;right:-20px;top:44px;width:640px;height:640px}
.phone{position:absolute;width:250px;border-radius:34px;background:#0b0f0f;padding:9px;box-shadow:0 40px 60px -20px rgba(0,0,0,.75),0 0 0 1.5px rgba(255,255,255,.08)}
.phone img{display:block;width:100%;border-radius:26px}
</style></head><body><div class="b">
<div class="left">
  <div class="brand"><img src="../public/logo.svg">
    <span class="t" style="color:#1c3f94">u</span><span class="t" style="color:#c3313b">l</span><span class="t" style="color:#c9651f">g</span>
  </div>
  <h1>Unlimited Logic Games</h1>
  <p>Logic puzzles you can't run out of. A fresh board every time, and it plays offline.</p>
  <div class="chips">
    <span class="chip" style="background:#1f5f5b">Endless boards</span><span class="chip" style="background:#4a3a6b">One answer each</span>
    <span class="chip" style="background:#6b2f4f">Hints that help</span><span class="chip" style="background:#1f4a6e">Works offline</span>
  </div>
  </div>
</div>
<div class="phones">
  <div class="phone" style="left:40px;top:70px;transform:rotate(-9deg)"><img src="screens/kings.png"></div>
  <div class="phone" style="left:330px;top:70px;transform:rotate(9deg)"><img src="screens/swatches.png"></div>
  <div class="phone" style="left:185px;top:20px;z-index:2"><img src="screens/zap.png"></div>
</div>
</div></body></html>
